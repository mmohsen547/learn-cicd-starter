name: cd


on:
  push:
    branches: [main]


jobs:

  deploy:
    
    name: Deploy

    runs-on: ubuntu-latest


    steps:

      - name: Check out code
        
        uses: actions/checkout@v6



      - name: Set up Go
        
        uses: actions/setup-go@v6
        
        with:
          go-version: "1.26.0"


      - name: Build app binary

        run: ./scripts/buildprod.sh

      - name: setup-gcloud
        
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-506200/notely-ar-repo/mmohsen547/notely:latest .
